# mini-fw's system group (see sysusers.d(5)). make install copies this
# file to /etc/sysusers.d/; systemd-sysusers creates the group now and,
# on a machine made from a staged install, at its first boot.
#
# mfw: the shipped mfwd.service gives its socket to this group, mode
# 0660. Whoever can connect replaces the policy: a member can run mfw
# without root, and sw_configd runs as one.
g mfw -
